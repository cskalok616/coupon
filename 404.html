<!DOCTYPE html>
<html lang="zh-Hant">

  <style>
    body {

      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f6fbff 0%, #eef5fb 100%);
      color: #10324f;
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    }

    .card {
      width: min(460px, calc(100% - 32px));

      border: 1px solid #d8e6f2;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 38px rgba(16, 50, 79, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.6rem;
    }

    p {
      margin: 0;
      color: #5b7a92;
      line-height: 1.6;
    }

    a {
      color: #1d6fd8;
      font-weight: 700;
    }

</head>
<body>
  <div class="card">
    <h1>正在返回首頁</h1>
    <p>如果頁面沒有自動跳轉，請按這裡：<a href="./index.html">回到消費券記錄 App</a></p>
