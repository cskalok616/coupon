<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>記錄與計算 App</title>
	<style>
		body {
			margin: 0;
			font-family: "Noto Sans TC", "PingFang TC", sans-serif;
			background: linear-gradient(135deg, #f2f7ff, #e7fff5);
			min-height: 100vh;
			display: grid;
			place-items: center;
		}

		.app {
			width: min(92vw, 720px);
			background: #ffffff;
			border-radius: 18px;
			padding: 24px;
			box-shadow: 0 14px 34px rgba(24, 42, 84, 0.16);
		}

		.banner-wrap {
			margin-bottom: 12px;
			border-radius: 14px;
			overflow: hidden;
			border: 1px solid #d6e8f7;
			background: #f4f9ff;
		}

		.banner-image {
			display: block;
			width: 100%;
			height: auto;
		}

		.banner-fallback {
			display: none;
			padding: 12px;
			color: #567089;
			font-size: 0.85rem;
			text-align: center;
		}

		.stats-box {
			margin-bottom: 14px;
			padding: 14px;
			border-radius: 14px;
			background: linear-gradient(145deg, #eff8ff, #f3fffb);
			border: 1px solid #d6e8f7;
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 10px;
		}

		.stat-item {
			background: #ffffff;
			border: 1px solid #deebf7;
			border-radius: 10px;
			padding: 10px;
		}

		.stat-label {
			display: block;
			font-size: 0.85rem;
			color: #4c6982;
			margin-bottom: 6px;
		}

		.stat-value {
			display: block;
			font-size: 1.05rem;
			font-weight: 800;
			color: #10324f;
		}

		.topbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
			position: relative;
		}

		h1 {
			margin: 0;
			font-size: 1.3rem;
			color: #10324f;
		}

		#addBtn {
			border: none;
			background: #0d8f6f;
			color: #fff;
			padding: 10px 16px;
			border-radius: 999px;
			font-size: 0.95rem;
			font-weight: 700;
			cursor: pointer;
		}

		#addBtn:hover {
			background: #0b775d;
		}

		.menu-panel {
			position: absolute;
			right: 0;
			top: calc(100% + 12px);
			width: min(86vw, 360px);
			background: #ffffff;
			border: 1px solid #d8e6f2;
			border-radius: 14px;
			box-shadow: 0 16px 30px rgba(16, 50, 79, 0.18);
			padding: 12px;
			display: none;
			z-index: 20;
		}

		.menu-panel.show {
			display: block;
			animation: pop 180ms ease-out;
		}

		.menu-title {
			margin: 4px 4px 10px;
			font-size: 0.92rem;
			color: #40627f;
			font-weight: 700;
		}

		.menu-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 8px;
		}

		.option-btn {
			border: 1px solid #cfe0ee;
			background: #f7fbff;
			color: #12304a;
			padding: 10px 8px;
			border-radius: 10px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
		}

		.option-btn:hover {
			background: #edf6ff;
			border-color: #8fb5d3;
		}

		.hint {
			margin: 14px 2px 2px;
			color: #5e7a92;
			font-size: 0.9rem;
		}

		.voucher-panel {
			margin-top: 14px;
			padding: 12px;
			border: 1px solid #d8e6f2;
			border-radius: 12px;
			background: #f8fcff;
			display: none;
		}

		.voucher-panel.show {
			display: block;
		}

		.finish-wrap {
			margin-top: 12px;
			display: none;
			justify-content: flex-end;
		}

		.finish-wrap.show {
			display: flex;
		}

		#finishBtn {
			border: none;
			background: #1d6fd8;
			color: #ffffff;
			padding: 10px 18px;
			border-radius: 10px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
		}

		#finishBtn:disabled {
			background: #a9bfdc;
			cursor: not-allowed;
		}

		.voucher-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 8px;
		}

		.voucher-card {
			padding: 10px;
			background: #ffffff;
			border: 1px solid #deebf7;
			border-radius: 10px;
		}

		.voucher-title {
			margin: 0 0 10px;
			text-align: center;
			color: #10324f;
			font-size: 1rem;
		}

		.value-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 6px;
		}

		.value-btn {
			border: 1px solid #cfe0ee;
			background: #f7fbff;
			color: #12304a;
			padding: 7px 0;
			border-radius: 8px;
			font-size: 0.82rem;
			font-weight: 700;
			cursor: pointer;
		}

		.value-btn:hover {
			background: #edf6ff;
		}

		.value-btn.selected {
			border-color: #0d8f6f;
			background: #daf6ee;
			color: #0b634d;
		}

		.record-section {
			margin-top: 16px;
			padding: 12px;
			border: 1px solid #d8e6f2;
			border-radius: 12px;
			background: #f8fcff;
		}

		.record-title {
			margin: 0 0 10px;
			font-size: 1rem;
			color: #10324f;
		}

		.record-meta {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 8px;
			margin-bottom: 10px;
		}

		.meta-item {
			background: #ffffff;
			border: 1px solid #d9e7f3;
			border-radius: 10px;
			padding: 8px 10px;
		}

		.meta-label {
			display: block;
			font-size: 0.8rem;
			color: #51708a;
			margin-bottom: 4px;
		}

		.meta-value {
			display: block;
			font-size: 0.9rem;
			font-weight: 700;
			color: #10324f;
		}

		.table-wrap {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			min-width: 760px;
			font-size: 0.79rem;
			table-layout: fixed;
		}

		th,
		td {
			border-bottom: 1px solid #d9e7f3;
			padding: 5px 4px;
			text-align: left;
			white-space: nowrap;
		}

		tbody td {
			font-size: 0.86rem;
		}

		th:nth-child(1),
		td:nth-child(1) { width: 26px; }

		th:nth-child(2),
		td:nth-child(2) { width: 98px; }

		th:nth-child(3),
		td:nth-child(3) { width: 74px; }

		th:nth-child(4),
		td:nth-child(4),
		th:nth-child(5),
		td:nth-child(5),
		th:nth-child(6),
		td:nth-child(6) { width: 46px; }

		th:nth-child(7),
		td:nth-child(7),
		th:nth-child(8),
		td:nth-child(8) { width: 68px; }

		th:nth-child(9),
		td:nth-child(9) { width: 56px; }

		th {
			color: #2a4b68;
			font-weight: 700;
			font-size: 0.86rem;
			background: #eef6fd;
		}

		.status-valid {
			color: #0b775d;
			font-weight: 700;
		}

		.status-expired {
			color: #b14d4d;
			font-weight: 700;
		}

		.delete-btn {
			border: 1px solid #d7a3a3;
			background: #fff5f5;
			color: #9d3333;
			padding: 2px 6px;
			border-radius: 6px;
			font-size: 0.7rem;
			font-weight: 700;
			cursor: pointer;
		}

		.amount-cell {
			display: inline-flex;
			align-items: center;
			gap: 2px;
			font-size: 0.82rem;
		}

		.edit-inline-btn {
			border: 1px solid #a6bdd6;
			background: #f2f8ff;
			color: #2e5f8b;
			width: 16px;
			height: 16px;
			padding: 0;
			border-radius: 4px;
			font-size: 0.58rem;
			line-height: 1;
			font-weight: 700;
			cursor: pointer;
		}

		.edit-chooser {
			margin-top: 10px;
			padding: 10px;
			border: 1px solid #cfe0ee;
			background: #ffffff;
			border-radius: 10px;
			display: none;
		}

		.edit-chooser.show {
			display: block;
		}

		.chooser-title {
			margin: 0 0 8px;
			font-size: 0.88rem;
			font-weight: 700;
			color: #2a4b68;
		}

		.chooser-grid {
			display: flex;
			gap: 6px;
			flex-wrap: wrap;
		}

		.chooser-btn {
			border: 1px solid #cfe0ee;
			background: #f7fbff;
			color: #12304a;
			padding: 6px 10px;
			border-radius: 8px;
			font-size: 0.8rem;
			font-weight: 700;
			cursor: pointer;
		}

		.chooser-btn.selected {
			border-color: #0d8f6f;
			background: #daf6ee;
			color: #0b634d;
		}

		.chooser-finish {
			border: none;
			background: #1d6fd8;
			color: #ffffff;
			padding: 6px 12px;
			border-radius: 8px;
			font-size: 0.8rem;
			font-weight: 700;
			cursor: pointer;
		}

		.expired-toggle-wrap {
			margin-top: 14px;
			display: flex;
			justify-content: center;
		}

		.expired-toggle-btn {
			border: 1px solid #d6c4a0;
			background: #fff7e8;
			color: #7a5520;
			padding: 9px 14px;
			border-radius: 999px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
		}

		.expired-toggle-btn:hover {
			background: #ffefd0;
		}

		.expired-section {
			margin-top: 14px;
			padding: 12px;
			border: 1px solid #ead9b8;
			border-radius: 12px;
			background: #fffaf1;
			display: none;
		}

		.expired-section.show {
			display: block;
		}

		.expired-empty {
			margin: 0;
			color: #7c6846;
			font-size: 0.9rem;
		}

		@media (max-width: 620px) {
			.stats-box {
				grid-template-columns: 1fr;
			}

			.record-meta {
				grid-template-columns: 1fr;
			}

			.voucher-grid {
				grid-template-columns: 1fr;
			}
		}

		@keyframes pop {
			from {
				opacity: 0;
				transform: translateY(-6px) scale(0.98);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}
	</style>
</head>
<body>
	<main class="app">
		<section class="banner-wrap" aria-label="活動橫幅">
			<img
				id="topBanner"
				class="banner-image"
				src="./banner.jpg"
				alt="消費券活動橫幅"
			/>
			<div id="bannerFallback" class="banner-fallback">找不到圖片，請將橫幅檔案命名為 banner.jpg 並放在同一資料夾。</div>
		</section>

		<section class="stats-box" aria-label="統計資訊">
			<div class="stat-item">
				<span class="stat-label">剩餘消費券金額</span>
				<strong class="stat-value" id="voucherLeft">MOP 0</strong>
			</div>
			<div class="stat-item">
				<span class="stat-label">總消費額</span>
				<strong class="stat-value" id="totalSpend">MOP 0</strong>
			</div>
		</section>

		<div class="topbar">
			<h1>我抽到的消費券</h1>
			<button id="addBtn" type="button" aria-expanded="false" aria-controls="menuPanel">新增</button>
			<section id="menuPanel" class="menu-panel" aria-label="支付渠道選項">
				<p class="menu-title">請選擇支付渠道</p>
				<div class="menu-grid">
					<button class="option-btn" type="button">澳門通 Mpay</button>
					<button class="option-btn" type="button">中銀</button>
					<button class="option-btn" type="button">支付寶(澳門)</button>
					<button class="option-btn" type="button">國際銀行</button>
					<button class="option-btn" type="button">工商銀行</button>
					<button class="option-btn" type="button">UePay</button>
					<button class="option-btn" type="button">大豐 豐付寶</button>
					<button class="option-btn" type="button">廣發錢包</button>
				</div>
			</section>
		</div>
		<p class="hint" id="hint">點擊右上角新增，開啟 8 個支付渠道。</p>
		<section class="voucher-panel" id="voucherPanel" aria-label="券標題">
			<div class="voucher-grid">
				<section class="voucher-card" data-voucher="券一">
					<h2 class="voucher-title">券一</h2>
					<div class="value-grid">
						<button class="value-btn" type="button" data-value="無">無</button>
						<button class="value-btn" type="button" data-value="10">10</button>
						<button class="value-btn" type="button" data-value="20">20</button>
						<button class="value-btn" type="button" data-value="50">50</button>
						<button class="value-btn" type="button" data-value="100">100</button>
						<button class="value-btn" type="button" data-value="200">200</button>
					</div>
				</section>
				<section class="voucher-card" data-voucher="券二">
					<h2 class="voucher-title">券二</h2>
					<div class="value-grid">
						<button class="value-btn" type="button" data-value="無">無</button>
						<button class="value-btn" type="button" data-value="10">10</button>
						<button class="value-btn" type="button" data-value="20">20</button>
						<button class="value-btn" type="button" data-value="50">50</button>
						<button class="value-btn" type="button" data-value="100">100</button>
						<button class="value-btn" type="button" data-value="200">200</button>
					</div>
				</section>
				<section class="voucher-card" data-voucher="券三">
					<h2 class="voucher-title">券三</h2>
					<div class="value-grid">
						<button class="value-btn" type="button" data-value="無">無</button>
						<button class="value-btn" type="button" data-value="10">10</button>
						<button class="value-btn" type="button" data-value="20">20</button>
						<button class="value-btn" type="button" data-value="50">50</button>
						<button class="value-btn" type="button" data-value="100">100</button>
						<button class="value-btn" type="button" data-value="200">200</button>
					</div>
				</section>
			</div>
			<div class="finish-wrap" id="finishWrap">
				<button id="finishBtn" type="button" disabled>完成</button>
			</div>
		</section>

		<section class="record-section" id="recordSection" aria-label="記錄列表">
			<h2 class="record-title">記錄列表</h2>
			<div class="record-meta" aria-label="記錄狀態資訊">
				<div class="meta-item">
					<span class="meta-label">過期日</span>
					<strong id="listExpiryDate" class="meta-value">-</strong>
				</div>
				<div class="meta-item">
					<span class="meta-label">狀態</span>
					<strong id="listStatus" class="meta-value">-</strong>
				</div>
			</div>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>期數</th>
							<th>支付渠道</th>
							<th>新增日期</th>
							<th>券一</th>
							<th>券二</th>
							<th>券三</th>
							<th>消費券總額</th>
							<th>總消費額</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="recordBody">
						<tr>
							<td colspan="9">尚未有記錄，請先選擇支付渠道與券金額後按完成。</td>
						</tr>
					</tbody>
				</table>
			</div>
			<section id="editChooser" class="edit-chooser" aria-label="修改券金額">
				<p id="chooserTitle" class="chooser-title">請選擇新金額</p>
				<div class="chooser-grid">
					<button class="chooser-btn" type="button" data-value="0">無</button>
					<button class="chooser-btn" type="button" data-value="10">10</button>
					<button class="chooser-btn" type="button" data-value="20">20</button>
					<button class="chooser-btn" type="button" data-value="50">50</button>
					<button class="chooser-btn" type="button" data-value="100">100</button>
					<button class="chooser-btn" type="button" data-value="200">200</button>
					<button id="chooserFinish" class="chooser-finish" type="button">完成</button>
				</div>
			</section>
			<div class="expired-toggle-wrap">
				<button id="expiredToggleBtn" class="expired-toggle-btn" type="button" aria-expanded="false" aria-controls="expiredSection">查看已過期消費券</button>
			</div>
			<section id="expiredSection" class="expired-section" aria-label="已過期消費券">
				<h2 class="record-title">已過期消費券</h2>
				<div class="table-wrap">
					<table>
						<thead>
							<tr>
								<th>期數</th>
								<th>支付渠道</th>
								<th>新增日期</th>
								<th>券一</th>
								<th>券二</th>
								<th>券三</th>
								<th>消費券總額</th>
								<th>總消費額</th>
								<th>狀態</th>
							</tr>
						</thead>
						<tbody id="expiredRecordBody">
							<tr>
								<td colspan="9">目前沒有已過期的消費券。</td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>
		</section>
	</main>

	<script>
		const addBtn = document.getElementById("addBtn");
		const menuPanel = document.getElementById("menuPanel");
		const hint = document.getElementById("hint");
		const voucherPanel = document.getElementById("voucherPanel");
		const totalSpendEl = document.getElementById("totalSpend");
		const voucherLeftEl = document.getElementById("voucherLeft");
		const finishWrap = document.getElementById("finishWrap");
		const finishBtn = document.getElementById("finishBtn");
		const recordBody = document.getElementById("recordBody");
		const listExpiryDate = document.getElementById("listExpiryDate");
		const listStatus = document.getElementById("listStatus");
		const editChooser = document.getElementById("editChooser");
		const expiredToggleBtn = document.getElementById("expiredToggleBtn");
		const expiredSection = document.getElementById("expiredSection");
		const expiredRecordBody = document.getElementById("expiredRecordBody");
		const chooserTitle = document.getElementById("chooserTitle");
		const chooserFinish = document.getElementById("chooserFinish");
		const chooserButtons = document.querySelectorAll(".chooser-btn");
		const topBanner = document.getElementById("topBanner");
		const bannerFallback = document.getElementById("bannerFallback");
		const optionButtons = document.querySelectorAll(".option-btn");
		const voucherCards = document.querySelectorAll(".voucher-card");

		const storageKey = "voucherRecordsV1";
		const maxRecords = 8;
		const periodRules = [
			{ label: "一", startMonth: 4, startDay: 10, endMonth: 4, endDay: 16 },
			{ label: "二", startMonth: 4, startDay: 17, endMonth: 4, endDay: 23 },
			{ label: "三", startMonth: 4, startDay: 24, endMonth: 4, endDay: 30 },
			{ label: "四", startMonth: 5, startDay: 1, endMonth: 5, endDay: 16 },
			{ label: "五", startMonth: 5, startDay: 8, endMonth: 5, endDay: 16 },
			{ label: "六", startMonth: 5, startDay: 15, endMonth: 5, endDay: 21 },
			{ label: "七", startMonth: 5, startDay: 22, endMonth: 5, endDay: 28 },
			{ label: "八", startMonth: 5, startDay: 29, endMonth: 6, endDay: 4 },
			{ label: "九", startMonth: 6, startDay: 5, endMonth: 6, endDay: 11 },
			{ label: "十", startMonth: 6, startDay: 12, endMonth: 6, endDay: 18 }
		];
		let selectedChannel = "";
		let editingRecordId = null;
		let editingField = "";
		let editingValue = 0;
		const selectedAmounts = {
			券一: 0,
			券二: 0,
			券三: 0
		};
		let records = loadRecords();

		topBanner.addEventListener("error", function () {
			topBanner.style.display = "none";
			bannerFallback.style.display = "block";
		});

		function closeMenu() {
			menuPanel.classList.remove("show");
			addBtn.setAttribute("aria-expanded", "false");
		}

		addBtn.addEventListener("click", function () {
			const isOpen = menuPanel.classList.toggle("show");
			addBtn.setAttribute("aria-expanded", String(isOpen));
		});

		document.addEventListener("click", function (event) {
			if (!menuPanel.contains(event.target) && !addBtn.contains(event.target)) {
				closeMenu();
			}
		});

		document.addEventListener("keydown", function (event) {
			if (event.key === "Escape") {
				closeMenu();
			}
		});

		function getSelectedValue(card) {
			const selectedBtn = card.querySelector(".value-btn.selected");
			if (!selectedBtn) {
				return 0;
			}
			const rawValue = selectedBtn.getAttribute("data-value");
			const numericValue = Number(rawValue);
			if (Number.isNaN(numericValue)) {
				return 0;
			}
			return numericValue;
		}

		function parseMopAmount(text) {
			const normalized = String(text).replace(/[^\d.-]/g, "");
			const value = Number(normalized);
			return Number.isNaN(value) ? 0 : value;
		}

		function calculateSummaryFromRecords() {
			let voucherSum = 0;
			let spendingSum = 0;
			records.forEach(function (record) {
				recalculateRecordTotals(record);
				voucherSum += record.voucherTotal;
				spendingSum += getRecordSpendingTotal(record);
			});
			return {
				voucherSum: voucherSum,
				spendingSum: spendingSum
			};
		}

		function verifySummaryConsistency() {
			const expected = calculateSummaryFromRecords();
			const shownVoucher = parseMopAmount(voucherLeftEl.textContent);
			const shownSpending = parseMopAmount(totalSpendEl.textContent);
			const isCorrect = shownVoucher === expected.voucherSum && shownSpending === expected.spendingSum;

			if (!isCorrect) {
				voucherLeftEl.textContent = "MOP " + expected.voucherSum;
				totalSpendEl.textContent = "MOP " + expected.spendingSum;
			}

			return isCorrect;
		}

		function updateStats() {
			const summary = calculateSummaryFromRecords();
			voucherLeftEl.textContent = "MOP " + summary.voucherSum;
			totalSpendEl.textContent = "MOP " + summary.spendingSum;
			finishBtn.disabled = !canFinishRecord();
			verifySummaryConsistency();
		}

		function formatDate(date) {
			const y = date.getFullYear();
			const m = String(date.getMonth() + 1).padStart(2, "0");
			const d = String(date.getDate()).padStart(2, "0");
			return y + "-" + m + "-" + d;
		}

		function parseDateString(dateStr) {
			if (typeof dateStr !== "string") {
				return null;
			}
			const parts = dateStr.split("-");
			if (parts.length !== 3) {
				return null;
			}
			const y = Number(parts[0]);
			const m = Number(parts[1]);
			const d = Number(parts[2]);
			if (Number.isNaN(y) || Number.isNaN(m) || Number.isNaN(d)) {
				return null;
			}
			return new Date(y, m - 1, d);
		}

		function fixedDate(month, day) {
			return new Date(2000, month - 1, day);
		}

		function getPeriodInfoByDate(dateObj) {
			const target = fixedDate(dateObj.getMonth() + 1, dateObj.getDate());
			for (let i = 0; i < periodRules.length; i += 1) {
				const rule = periodRules[i];
				const start = fixedDate(rule.startMonth, rule.startDay);
				const end = fixedDate(rule.endMonth, rule.endDay);
				if (target >= start && target <= end) {
					return {
						label: rule.label,
						startMonth: rule.startMonth,
						startDay: rule.startDay,
						expiryMonth: rule.endMonth,
						expiryDay: rule.endDay
					};
				}
			}
			return null;
		}

		function ensurePeriodData(record) {
			const created = parseDateString(record.createdDate);
			if (!created) {
				if (!record.phaseLabel) {
					record.phaseLabel = "-";
				}
				if (!record.phaseStartDate) {
					record.phaseStartDate = "-";
				}
				if (!record.expiryDate) {
					record.expiryDate = "-";
				}
				record.status = getStatus(record.phaseStartDate, record.expiryDate);
				return;
			}

			const periodInfo = getPeriodInfoByDate(created);
			if (!periodInfo) {
				record.phaseLabel = "-";
				record.phaseStartDate = record.createdDate;
				record.expiryDate = formatDate(addDays(created, 180));
				record.status = getStatus(record.phaseStartDate, record.expiryDate);
				return;
			}

			record.phaseLabel = periodInfo.label;
			const startDateObj = new Date(created.getFullYear(), periodInfo.startMonth - 1, periodInfo.startDay);
			record.phaseStartDate = formatDate(startDateObj);
			const expiryDateObj = new Date(created.getFullYear(), periodInfo.expiryMonth - 1, periodInfo.expiryDay);
			record.expiryDate = formatDate(expiryDateObj);
			record.status = getStatus(record.phaseStartDate, record.expiryDate);
		}

		function addDays(date, days) {
			const copy = new Date(date);
			copy.setDate(copy.getDate() + days);
			return copy;
		}

		function getStatus(phaseStartDateStr, expiryDateStr) {
			const now = new Date();
			const today = new Date(now);
			today.setHours(0, 0, 0, 0);
			const expiry = new Date(expiryDateStr + "T23:59:59");
			if (Number.isNaN(expiry.getTime())) {
				return "-";
			}
			const msPerDay = 24 * 60 * 60 * 1000;
			const remainingMs = expiry.getTime() - now.getTime();
			if (remainingMs < 0) {
				const expiredDays = Math.ceil(Math.abs(remainingMs) / msPerDay);
				return "已過期 " + expiredDays + " 天";
			}
			const diffDays = Math.floor(remainingMs / msPerDay);
			const diffHours = Math.ceil(remainingMs / (60 * 60 * 1000));

			const phaseStart = new Date(phaseStartDateStr + "T00:00:00");
			if (Number.isNaN(phaseStart.getTime())) {
				if (diffDays < 1) {
					return "剩餘 " + diffHours + " 小時";
				}
				return "剩餘 " + diffDays + " 天";
			}

			const lotteryEnd = new Date(phaseStart);
			lotteryEnd.setDate(lotteryEnd.getDate() + 2);
			const remainingText = diffDays < 1 ? ("剩餘 " + diffHours + " 小時") : ("剩餘 " + diffDays + " 天");
			if (today <= lotteryEnd) {
				return "抽獎中（" + remainingText + "）";
			}
			return "消費中（" + remainingText + "）";
		}

		function canFinishRecord() {
			return Boolean(selectedChannel);
		}

		function loadRecords() {
			const raw = localStorage.getItem(storageKey);
			if (!raw) {
				return [];
			}
			try {
				const parsed = JSON.parse(raw);
				if (!Array.isArray(parsed)) {
					return [];
				}
				const unique = [];
				const seenChannels = new Set();
				for (let i = 0; i < parsed.length; i += 1) {
					const item = parsed[i];
					if (!item || typeof item.channel !== "string") {
						continue;
					}
					if (seenChannels.has(item.channel)) {
						continue;
					}
					seenChannels.add(item.channel);
					unique.push(item);
					if (unique.length >= maxRecords) {
						break;
					}
				}
				return unique;
			} catch (error) {
				return [];
			}
		}

		function saveRecords() {
			localStorage.setItem(storageKey, JSON.stringify(records));
		}

		function normalizeNumber(value) {
			return typeof value === "number" && !Number.isNaN(value) ? value : 0;
		}

		function recalculateRecordTotals(record) {
			record.voucher1 = normalizeNumber(record.voucher1);
			record.voucher2 = normalizeNumber(record.voucher2);
			record.voucher3 = normalizeNumber(record.voucher3);
			record.voucherTotal = record.voucher1 + record.voucher2 + record.voucher3;
			record.spendingTotal = record.voucherTotal * 3;
		}

		function getRecordSpendingTotal(record) {
			if (typeof record.spendingTotal === "number" && !Number.isNaN(record.spendingTotal)) {
				return record.spendingTotal;
			}
			if (typeof record.voucherTotal === "number" && !Number.isNaN(record.voucherTotal)) {
				return record.voucherTotal * 3;
			}
			if (typeof record.total === "number" && !Number.isNaN(record.total)) {
				return record.total * 3;
			}
			return 0;
		}

		function getVoucherLabel(field) {
			if (field === "voucher1") {
				return "券一";
			}
			if (field === "voucher2") {
				return "券二";
			}
			if (field === "voucher3") {
				return "券三";
			}
			return "券";
		}

		function closeEditChooser() {
			editChooser.classList.remove("show");
			editingRecordId = null;
			editingField = "";
			editingValue = 0;
			chooserButtons.forEach(function (btn) {
				btn.classList.remove("selected");
			});
		}

		function openEditChooser(recordId, field, currentValue) {
			editingRecordId = recordId;
			editingField = field;
			editingValue = currentValue;
			chooserTitle.textContent = "修改 " + getVoucherLabel(field) + " 金額";
			chooserButtons.forEach(function (btn) {
				btn.classList.toggle("selected", Number(btn.getAttribute("data-value")) === currentValue);
			});
			editChooser.classList.add("show");
		}

		function isExpiredStatus(statusText) {
			return typeof statusText === "string" && statusText.indexOf("已過期") === 0;
		}

		function renderExpiredRecords() {
			const expiredRecords = records.filter(function (record) {
				ensurePeriodData(record);
				return isExpiredStatus(record.status);
			});

			if (expiredRecords.length === 0) {
				expiredRecordBody.innerHTML = "<tr><td colspan=\"9\">目前沒有已過期的消費券。</td></tr>";
				return;
			}

			expiredRecordBody.innerHTML = expiredRecords.map(function (record) {
				recalculateRecordTotals(record);
				return "<tr>"
					+ "<td>" + record.phaseLabel + "</td>"
					+ "<td>" + record.channel + "</td>"
					+ "<td>" + record.createdDate + "</td>"
					+ "<td>" + record.voucher1 + "</td>"
					+ "<td>" + record.voucher2 + "</td>"
					+ "<td>" + record.voucher3 + "</td>"
					+ "<td>" + record.voucherTotal + "</td>"
					+ "<td>" + record.spendingTotal + "</td>"
					+ "<td class=\"status-expired\">" + record.status + "</td>"
					+ "</tr>";
			}).join("");
		}

		function renderRecords() {
			if (records.length === 0) {
				recordBody.innerHTML = "<tr><td colspan=\"9\">尚未有記錄，請先選擇支付渠道與券金額後按完成。</td></tr>";
				renderExpiredRecords();
				listExpiryDate.textContent = "-";
				listStatus.textContent = "-";
				closeEditChooser();
				verifySummaryConsistency();
				return;
			}

			recordBody.innerHTML = records.map(function (record) {
				recalculateRecordTotals(record);
				ensurePeriodData(record);
				return "<tr>"
					+ "<td>" + record.phaseLabel + "</td>"
					+ "<td>" + record.channel + "</td>"
					+ "<td>" + record.createdDate + "</td>"
					+ "<td><div class=\"amount-cell\"><span>" + record.voucher1 + "</span><button type=\"button\" class=\"edit-inline-btn edit-voucher-btn\" data-id=\"" + record.id + "\" data-field=\"voucher1\" aria-label=\"修改券一金額\" title=\"修改券一金額\">&#9998;</button></div></td>"
					+ "<td><div class=\"amount-cell\"><span>" + record.voucher2 + "</span><button type=\"button\" class=\"edit-inline-btn edit-voucher-btn\" data-id=\"" + record.id + "\" data-field=\"voucher2\" aria-label=\"修改券二金額\" title=\"修改券二金額\">&#9998;</button></div></td>"
					+ "<td><div class=\"amount-cell\"><span>" + record.voucher3 + "</span><button type=\"button\" class=\"edit-inline-btn edit-voucher-btn\" data-id=\"" + record.id + "\" data-field=\"voucher3\" aria-label=\"修改券三金額\" title=\"修改券三金額\">&#9998;</button></div></td>"
					+ "<td>" + record.voucherTotal + "</td>"
					+ "<td>" + record.spendingTotal + "</td>"
					+ "<td><button type=\"button\" class=\"delete-btn\" data-id=\"" + record.id + "\">刪除</button></td>"
					+ "</tr>";
			}).join("");

			const latestRecord = records[0];
			ensurePeriodData(latestRecord);
			listExpiryDate.textContent = latestRecord.expiryDate || "-";
			listStatus.textContent = latestRecord.status || "-";
			renderExpiredRecords();

			verifySummaryConsistency();
		}

		function clearSelections() {
			voucherCards.forEach(function (card) {
				card.querySelectorAll(".value-btn").forEach(function (btn) {
					btn.classList.remove("selected");
				});
			});
			selectedAmounts.券一 = 0;
			selectedAmounts.券二 = 0;
			selectedAmounts.券三 = 0;
			finishWrap.classList.remove("show");
		}

		optionButtons.forEach(function (btn) {
			btn.addEventListener("click", function () {
				selectedChannel = btn.textContent;
				clearSelections();
				hint.textContent = "你選擇的支付渠道：" + selectedChannel;
				voucherPanel.classList.add("show");
				finishWrap.classList.add("show");
				updateStats();
				closeMenu();
			});
		});

		voucherCards.forEach(function (card) {
			const voucherName = card.getAttribute("data-voucher");
			const valueButtons = card.querySelectorAll(".value-btn");

			valueButtons.forEach(function (valueBtn) {
				valueBtn.addEventListener("click", function () {
					valueButtons.forEach(function (btn) {
						btn.classList.remove("selected");
					});
					valueBtn.classList.add("selected");
					selectedAmounts[voucherName] = Number(valueBtn.getAttribute("data-value")) || 0;
					finishWrap.classList.add("show");
					hint.textContent = voucherName + " 已選擇：" + valueBtn.getAttribute("data-value");
					updateStats();
				});
			});
		});

		finishBtn.addEventListener("click", function () {
			if (!selectedChannel) {
				hint.textContent = "請先選擇支付渠道。";
				return;
			}

			const duplicate = records.some(function (record) {
				return record.channel === selectedChannel;
			});
			if (duplicate) {
				hint.textContent = "此支付渠道已存在，不能重覆新增。";
				return;
			}

			if (records.length >= maxRecords) {
				hint.textContent = "記錄列表最多只能有 8 筆數據。";
				return;
			}

			const now = new Date();
			const createdDate = formatDate(now);
			const periodInfo = getPeriodInfoByDate(now);
			const phaseLabel = periodInfo ? periodInfo.label : "-";
			const phaseStartDate = periodInfo
				? formatDate(new Date(now.getFullYear(), periodInfo.startMonth - 1, periodInfo.startDay))
				: createdDate;
			const expiryDate = periodInfo
				? formatDate(new Date(now.getFullYear(), periodInfo.expiryMonth - 1, periodInfo.expiryDay))
				: formatDate(addDays(now, 180));
			let voucher1 = 0;
			let voucher2 = 0;
			let voucher3 = 0;

			voucherCards.forEach(function (card) {
				const voucherName = card.getAttribute("data-voucher");
				const value = getSelectedValue(card);
				if (voucherName === "券一") {
					voucher1 = value;
				}
				if (voucherName === "券二") {
					voucher2 = value;
				}
				if (voucherName === "券三") {
					voucher3 = value;
				}
			});
			const voucherTotal = voucher1 + voucher2 + voucher3;
			const spendingTotal = voucherTotal * 3;
			const status = getStatus(phaseStartDate, expiryDate);

			records.unshift({
				id: Date.now(),
				phaseLabel: phaseLabel,
				phaseStartDate: phaseStartDate,
				channel: selectedChannel,
				createdDate: createdDate,
				voucher1: voucher1,
				voucher2: voucher2,
				voucher3: voucher3,
				voucherTotal: voucherTotal,
				spendingTotal: spendingTotal,
				expiryDate: expiryDate,
				status: status
			});

			saveRecords();
			renderRecords();
			hint.textContent = "已記錄完成：" + selectedChannel + "，消費券總額 " + voucherTotal;
			voucherPanel.classList.remove("show");
			clearSelections();
			updateStats();
			finishBtn.disabled = true;
		});

		recordBody.addEventListener("click", function (event) {
			const target = event.target;
			if (!(target instanceof HTMLElement)) {
				return;
			}
			if (target.classList.contains("edit-voucher-btn")) {
				const id = Number(target.getAttribute("data-id"));
				const field = target.getAttribute("data-field") || "";
				const record = records.find(function (item) {
					return item.id === id;
				});
				if (!record || !field) {
					return;
				}
				const currentValue = normalizeNumber(record[field]);
				openEditChooser(id, field, currentValue);
				return;
			}

			if (!target.classList.contains("delete-btn")) {
				return;
			}

			const id = Number(target.getAttribute("data-id"));
			records = records.filter(function (record) {
				return record.id !== id;
			});
			saveRecords();
			renderRecords();
			updateStats();
			if (editingRecordId === id) {
				closeEditChooser();
			}
		});

		chooserButtons.forEach(function (btn) {
			btn.addEventListener("click", function () {
				editingValue = Number(btn.getAttribute("data-value")) || 0;
				chooserButtons.forEach(function (item) {
					item.classList.remove("selected");
				});
				btn.classList.add("selected");
			});
		});

		chooserFinish.addEventListener("click", function () {
			if (!editingRecordId || !editingField) {
				return;
			}

			const record = records.find(function (item) {
				return item.id === editingRecordId;
			});
			if (!record) {
				closeEditChooser();
				return;
			}

			record[editingField] = editingValue;
			recalculateRecordTotals(record);
			saveRecords();
			renderRecords();
			updateStats();
			hint.textContent = record.channel + " 的 " + getVoucherLabel(editingField) + " 已修改為 " + editingValue;
			closeEditChooser();
		});

		expiredToggleBtn.addEventListener("click", function () {
			const isOpen = expiredSection.classList.toggle("show");
			expiredToggleBtn.setAttribute("aria-expanded", String(isOpen));
			expiredToggleBtn.textContent = isOpen ? "收起已過期消費券" : "查看已過期消費券";
			if (isOpen) {
				renderExpiredRecords();
			}
		});

		renderRecords();
		updateStats();
	</script>
</body>
</html>
