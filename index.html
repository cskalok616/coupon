<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>消費券記錄 App</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #eef5fb;
			--panel: #ffffff;
			--panel-soft: #f8fcff;
			--line: #d8e6f2;
			--text: #10324f;
			--muted: #5b7a92;
			--brand: #1d6fd8;
			--brand-2: #0d8f6f;
			--danger: #d13f3f;
			--shadow: 0 18px 38px rgba(16, 50, 79, 0.12);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: "PingFang TC", "Noto Sans TC", sans-serif;
			background:
				radial-gradient(circle at top right, rgba(29, 111, 216, 0.14), transparent 28%),
				linear-gradient(180deg, #f6fbff 0%, var(--bg) 100%);
			color: var(--text);
		}

		.app {
			max-width: 1100px;
			margin: 0 auto;
			padding: 18px;
		}

		.banner-wrap {
			position: relative;
			margin-bottom: 16px;
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 18px;
			padding: 12px;
			box-shadow: var(--shadow);
		}

		.banner-image {
			width: 100%;
			height: 220px;
			object-fit: cover;
			border-radius: 14px;
			display: block;
		}

		.banner-fallback {
			display: none;
			padding: 36px 18px;
			border-radius: 14px;
			background: #eff6fd;
			color: var(--muted);
			text-align: center;
		}

		.stats-box {
			margin-top: 12px;
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 10px;
		}

		.stat-item {
			padding: 14px;
			background: var(--panel-soft);
			border: 1px solid var(--line);
			border-radius: 14px;
		}

		.stat-label {
			display: block;
			font-size: 0.82rem;
			color: var(--muted);
			margin-bottom: 6px;
		}

		.stat-value {
			font-size: 1.3rem;
			font-weight: 700;
		}

		.topbar {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 12px;
			margin-bottom: 14px;
		}

		.title-block {
			display: grid;
			gap: 8px;
		}

		h1 {
			margin: 0;
			font-size: 1.7rem;
		}

		.member-switcher-wrap {
			display: grid;
			gap: 6px;
		}

		.switcher-label {
			font-size: 0.82rem;
			font-weight: 700;
			color: var(--muted);
		}

		.member-options {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.member-pill {
			border: 1px solid #cfe0ee;
			background: #f7fbff;
			color: #1c4566;
			padding: 6px 13px;
			border-radius: 999px;
			font-size: 0.86rem;
			font-weight: 700;
			cursor: pointer;
		}

		.member-pill.active {
			border-color: var(--brand-2);
			background: #daf6ee;
			color: #0b634d;
		}

		.topbar-actions {
			display: flex;
			align-items: center;
			gap: 8px;
			flex-wrap: wrap;
			justify-content: flex-end;
		}

		.user-tag,
		.view-tag {
			font-size: 0.8rem;
			font-weight: 700;
			color: #18476b;
			background: #e9f3ff;
			border: 1px solid #c7ddf1;
			padding: 6px 10px;
			border-radius: 999px;
		}

		#logoutBtn,
		#addBtn,
		#finishBtn,
		#cancelBtn,
		.chooser-finish,
		.delete-btn,
		.expired-toggle-btn,
		.login-submit {
			font-family: inherit;
		}

		#logoutBtn {
			border: 1px solid #cfdceb;
			background: #f2f7ff;
			color: #244968;
			padding: 8px 12px;
			border-radius: 999px;
			font-size: 0.84rem;
			font-weight: 700;
			cursor: pointer;
			display: none;
		}

		#logoutBtn.show {
			display: inline-block;
		}

		#addBtn {
			border: none;
			background: var(--brand-2);
			color: #fff;
			padding: 9px 14px;
			border-radius: 999px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
		}

		#addBtn:disabled {
			background: #95b8ad;
			cursor: not-allowed;
		}

		.menu-panel {
			display: none;
			margin-bottom: 14px;
			padding: 12px;
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 16px;
			box-shadow: var(--shadow);
		}

		.menu-panel.show,
		.voucher-panel.show,
		.finish-wrap.show,
		.edit-chooser.show,
		.expired-section.show {
			display: block;
		}

		.option-grid,
		.chooser-grid {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
		}

		.option-btn,
		.chooser-btn,
		.value-btn {
			border: 1px solid #cfe0ee;
			background: #f7fbff;
			color: #12304a;
			padding: 8px 12px;
			border-radius: 10px;
			font-size: 0.86rem;
			font-weight: 700;
			cursor: pointer;
		}

		.option-btn:hover,
		.chooser-btn:hover,
		.value-btn:hover {
			background: #edf6ff;
		}

		.chooser-btn.selected,
		.value-btn.selected {
			border-color: var(--brand-2);
			background: #daf6ee;
			color: #0b634d;
		}

		.voucher-panel,
		.record-section,
		.edit-chooser,
		.expired-section {
			display: none;
			margin-bottom: 14px;
			padding: 14px;
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 16px;
			box-shadow: var(--shadow);
		}

		.record-section {
			display: block;
		}

		.panel-title,
		.record-title {
			margin: 0 0 12px;
			font-size: 1rem;
		}

		.voucher-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 10px;
		}

		.voucher-card {
			padding: 12px;
			background: #ffffff;
			border: 1px solid #deebf7;
			border-radius: 12px;
		}

		.voucher-title {
			margin: 0 0 10px;
			text-align: center;
			font-size: 1rem;
		}

		.value-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 6px;
		}

		.finish-wrap {
			display: none;
			margin-bottom: 14px;
			text-align: right;
		}

		#finishBtn {
			border: none;
			background: var(--brand);
			color: #ffffff;
			padding: 10px 18px;
			border-radius: 10px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
			margin-left: 8px;
		}

		#finishBtn:disabled {
			background: #a9bfdc;
			cursor: not-allowed;
		}

		#cancelBtn {
			border: none;
			background: var(--danger);
			color: #ffffff;
			padding: 10px 18px;
			border-radius: 10px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
		}

		.record-meta {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 8px;
			margin-bottom: 12px;
		}

		.meta-item {
			background: #ffffff;
			border: 1px solid #d9e7f3;
			border-radius: 10px;
			padding: 8px 10px;
		}

		.meta-label {
			display: block;
			font-size: 0.8rem;
			color: var(--muted);
			margin-bottom: 4px;
		}

		.meta-value {
			display: block;
			font-size: 0.9rem;
			font-weight: 700;
		}

		.hint {
			margin: 0 0 12px;
			font-size: 0.9rem;
			color: var(--muted);
		}

		.readonly-note {
			margin-bottom: 12px;
			padding: 10px 12px;
			border-radius: 10px;
			background: #fff5da;
			color: #7a5520;
			font-size: 0.88rem;
			display: none;
		}

		.readonly-note.show {
			display: block;
		}

		.table-wrap {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			min-width: 155px;
			font-size: 0.82rem;
			table-layout: auto;
		}

		.record-section table {
			width: 325px;
			min-width: 423px;
			table-layout: fixed;
		}

		.col-created-by {
			width: 20px;
		}

		.col-phase {
			width: 20px;
		}

		.col-channel {
			width: 50px;
		}

		.col-voucher {
			width: 35px;
		}

		.col-total {
			width: 45px;
		}

		.col-spending-total {
			width: 45px;
		}

		.col-action {
			width: 60px;
		}

		th,
		td {
			padding: 7px 0;
			border-bottom: 1px solid #e5eef7;
			text-align: center;
			color: #2a4b68;
		}

		.record-section table th:nth-child(1),
		.record-section table td:nth-child(1) {
			padding-right: 0;
		}

		.record-section table th:nth-child(2),
		.record-section table td:nth-child(2) {
			padding-left: 0;
			padding-right: 0;
		}

		.record-section table th:nth-child(3),
		.record-section table td:nth-child(3) {
			padding-left: 0;
		}

		th {
			background: #f3f8fd;
			font-weight: 700;
		}

		.amount-cell {
			display: inline-flex;
			align-items: center;
			gap: 0;
		}

		.action-cell {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 2px;
			flex-wrap: nowrap;
			white-space: nowrap;
		}

		.edit-inline-btn,
		.consume-btn,
		.delete-btn {
			border: none;
			padding: 6px 8px;
			border-radius: 8px;
			font-size: 0.8rem;
			font-weight: 700;
			cursor: pointer;
		}

		.edit-inline-btn {
			background: #eaf2ff;
			color: var(--brand);
			padding: 1px 2px;
			font-size: 0.62rem;
			border-radius: 4px;
			line-height: 1;
		}

		.consume-btn {
			background: #e6f8ec;
			color: #1f7a47;
			padding: 2px 4px;
			font-size: 0.7rem;
			font-weight: 400;
			border-radius: 6px;
			line-height: 1;
		}

		.delete-btn {
			background: #ffe4e4;
			color: #a12626;
			padding: 2px 4px;
			font-size: 0.7rem;
			font-weight: 400;
			line-height: 1;
		}

		button[disabled] {
			opacity: 0.55;
			cursor: not-allowed;
		}

		.expired-section {
			background: #fffaf1;
			border-color: #ead9b8;
		}

		.expired-toggle-wrap {
			margin-bottom: 14px;
			display: flex;
			justify-content: center;
		}

		.expired-toggle-btn {
			border: 1px solid #d6c4a0;
			background: #fff7e8;
			color: #7a5520;
			padding: 9px 14px;
			border-radius: 999px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
		}

		.login-overlay {
			position: fixed;
			inset: 0;
			background: rgba(12, 28, 45, 0.56);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			z-index: 99;
		}

		.login-card {
			width: min(92vw, 420px);
			background: #ffffff;
			border: 1px solid var(--line);
			border-radius: 16px;
			padding: 18px;
			box-shadow: 0 16px 36px rgba(16, 50, 79, 0.28);
		}

		.login-title {
			margin: 0 0 10px;
			font-size: 1.1rem;
		}

		.login-form {
			display: grid;
			gap: 10px;
		}

		.login-input {
			width: 100%;
			border: 1px solid #cfe0ee;
			border-radius: 10px;
			padding: 10px 12px;
			font-size: 0.92rem;
		}

		.login-submit {
			border: none;
			background: var(--brand);
			color: #ffffff;
			padding: 10px 14px;
			border-radius: 10px;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
		}

		.login-error {
			min-height: 1.1em;
			margin: 10px 0 0;
			color: #b93636;
			font-size: 0.84rem;
		}

		@media (max-width: 760px) {
			.topbar {
				flex-direction: column;
			}

			.topbar-actions {
				justify-content: flex-start;
			}

			.stats-box,
			.record-meta,
			.voucher-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<section id="loginOverlay" class="login-overlay" aria-label="登入面板">
		<div class="login-card">
			<h2 class="login-title">喂，登入左先喇</h2>
			<form id="loginForm" class="login-form">
				<input id="loginUser" class="login-input" type="text" placeholder="帳號" autocomplete="username" required />
				<button class="login-submit" type="submit">登入</button>
			</form>
			<p id="loginError" class="login-error"></p>
		</div>
	</section>

	<main class="app">
		<section class="banner-wrap" aria-label="活動橫幅">
			<img id="topBanner" class="banner-image" src="./banner.jpg" alt="消費券活動橫幅" />
			<div id="bannerFallback" class="banner-fallback">找不到圖片，請將橫幅檔案命名為 banner.jpg 並放在同一資料夾。</div>
			<div class="stats-box">
				<div class="stat-item">
					<span class="stat-label">消費券總金額</span>
					<strong class="stat-value" id="voucherLeft">MOP 0</strong>
				</div>
				<div class="stat-item">
					<span class="stat-label">總消費額</span>
					<strong class="stat-value" id="totalSpend">MOP 0</strong>
				</div>
			</div>
		</section>

		<div class="topbar">
			<div class="title-block">
				<h1>下面這個人抽到的消費券</h1>
				<div class="member-switcher-wrap">
					<div class="member-options" id="accountSwitcher" aria-label="登入帳號群">
						<button class="member-pill" type="button" data-user="樂">樂</button>
						<button class="member-pill" type="button" data-user="珊">珊</button>
						<button class="member-pill" type="button" data-user="旭">旭</button>
						<button class="member-pill" type="button" data-user="苑">苑</button>
						<button class="member-pill" type="button" data-user="澤">澤</button>
						<button class="member-pill" type="button" data-user="瑩">瑩</button>
						<button class="member-pill" type="button" data-user="婆">婆</button>
						<button class="member-pill" type="button" data-user="影">影</button>
						<button class="member-pill" type="button" data-user="富">富</button>
						<button class="member-pill" type="button" data-user="妍">妍</button>
						<button class="member-pill" type="button" data-user="玥">玥</button>
					</div>
				</div>
			</div>
			<div class="topbar-actions">
				<span id="currentViewTag" class="view-tag">目前檢視：樂</span>
				<span id="currentUserTag" class="user-tag">未登入</span>
				<button id="logoutBtn" type="button">登出</button>
				<button id="addBtn" type="button" aria-expanded="false" aria-controls="menuPanel">新增</button>
			</div>
		</div>

		<section id="menuPanel" class="menu-panel" aria-label="支付渠道選項">
			<div class="option-grid">
				<button class="option-btn" type="button">Mpay</button>
				<button class="option-btn" type="button">中國銀行</button>
				<button class="option-btn" type="button">支付寶</button>
				<button class="option-btn" type="button">國際銀行</button>
				<button class="option-btn" type="button">工商銀行</button>
				<button class="option-btn" type="button">UePay</button>
				<button class="option-btn" type="button">豐付寶</button>
				<button class="option-btn" type="button">廣發錢包</button>
			</div>
		</section>

		<section id="voucherPanel" class="voucher-panel">
			<h2 class="panel-title">設定本次消費券金額</h2>
			<div class="voucher-grid">
				<div class="voucher-card" data-voucher="券一">
					<h3 class="voucher-title">券一</h3>
					<div class="value-grid">
						<button class="value-btn" type="button" data-value="0">無</button>
						<button class="value-btn" type="button" data-value="10">10</button>
						<button class="value-btn" type="button" data-value="20">20</button>
						<button class="value-btn" type="button" data-value="50">50</button>
						<button class="value-btn" type="button" data-value="100">100</button>
						<button class="value-btn" type="button" data-value="200">200</button>
					</div>
				</div>
				<div class="voucher-card" data-voucher="券二">
					<h3 class="voucher-title">券二</h3>
					<div class="value-grid">
						<button class="value-btn" type="button" data-value="0">無</button>
						<button class="value-btn" type="button" data-value="10">10</button>
						<button class="value-btn" type="button" data-value="20">20</button>
						<button class="value-btn" type="button" data-value="50">50</button>
						<button class="value-btn" type="button" data-value="100">100</button>
						<button class="value-btn" type="button" data-value="200">200</button>
					</div>
				</div>
				<div class="voucher-card" data-voucher="券三">
					<h3 class="voucher-title">券三</h3>
					<div class="value-grid">
						<button class="value-btn" type="button" data-value="0">無</button>
						<button class="value-btn" type="button" data-value="10">10</button>
						<button class="value-btn" type="button" data-value="20">20</button>
						<button class="value-btn" type="button" data-value="50">50</button>
						<button class="value-btn" type="button" data-value="100">100</button>
						<button class="value-btn" type="button" data-value="200">200</button>
					</div>
				</div>
			</div>
		</section>

		<div id="finishWrap" class="finish-wrap">
			<button id="cancelBtn" type="button">取消</button>
			<button id="finishBtn" type="button" disabled>完成</button>
		</div>

		<section class="record-section">
			<h2 class="record-title">記錄列表</h2>
			<p id="hint" class="hint">請先登入後再操作。</p>
			<div id="readonlyNote" class="readonly-note">目前正在查看其他帳號的列表，你只能檢視，不能修改或刪除。</div>
			<div class="record-meta">
				<div class="meta-item">
					<span class="meta-label">目前檢視帳號</span>
					<strong id="listOwner" class="meta-value">樂</strong>
				</div>
				<div class="meta-item">
					<span class="meta-label">最近到期日</span>
					<strong id="listExpiryDate" class="meta-value">-</strong>
				</div>
				<div class="meta-item">
					<span class="meta-label">狀態</span>
					<strong id="listStatus" class="meta-value">-</strong>
				</div>
			</div>
			<div class="table-wrap">
				<table id="recordTable">
					<colgroup>
						<col class="col-phase" />
						<col class="col-channel" />
						<col class="col-voucher" />
						<col class="col-voucher" />
						<col class="col-voucher" />
						<col class="col-total" />
						<col class="col-spending-total" />
						<col class="col-action" />
					</colgroup>
					<thead>
						<tr>
							<th>期</th>
							<th>渠道</th>
							<th>券一</th>
							<th>券二</th>
							<th>券三</th>
							<th>券總額</th>
							<th>消費額</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="recordBody"></tbody>
				</table>
			</div>
		</section>

		<section id="editChooser" class="edit-chooser">
			<h2 id="chooserTitle" class="panel-title">修改金額</h2>
			<div class="chooser-grid">
				<button class="chooser-btn" type="button" data-value="0">無</button>

		function getStorageKey(user) {
			return storageKeyPrefix + user;
		}

			return expiredStorageKeyPrefix + user;
		}

		function normalizeChannelName(channel) {
			if (typeof channel !== "string") {
				return channel;
			}
			return channelAliases[channel] || channel;
		}

		function getCleanArray(list) {
			if (!Array.isArray(list)) {
				return { items: [], changed: false };
			}
			let changed = false;
			const items = list.filter(function (item) {
				return item && typeof item.channel === "string";
			}).map(function (item) {
				const normalizedChannel = normalizeChannelName(item.channel);
				if (normalizedChannel !== item.channel) {
					changed = true;
					return Object.assign({}, item, { channel: normalizedChannel });
				}
				return item;
			});
			return { items: items, changed: changed };
		}

		function loadRecords(user) {
			const raw = localStorage.getItem(getStorageKey(user));
			if (!raw) {
				return [];
			}
			try {
				const cleaned = getCleanArray(JSON.parse(raw));
				if (cleaned.changed) {
					localStorage.setItem(getStorageKey(user), JSON.stringify(cleaned.items));
				}
				return cleaned.items;
			} catch (error) {
				return [];
			}
		}

		function loadExpiredRecords(user) {
			const raw = localStorage.getItem(getExpiredStorageKey(user));

		function persistLocal() {
			localStorage.setItem(getStorageKey(currentViewUser), JSON.stringify(records));
			localStorage.setItem(getExpiredStorageKey(currentViewUser), JSON.stringify(expiredRecords));
		}

		function subscribeCloudData() {
			if (!realtimeDb || !currentViewUser) {
				return;
			}
			if (cloudRef && cloudHandler) {
				cloudRef.off("value", cloudHandler);
			}
			cloudRef = realtimeDb.ref(cloudRootPath + "/" + currentViewUser);
			cloudHandler = function (snapshot) {
				const data = snapshot.val();
				if (!data) {
					cloudRef.set({
						records: records,
						expiredRecords: expiredRecords,
						updatedAt: Date.now()
					});
					return;
				}
				const cleanedRecords = getCleanArray(data.records);
				const cleanedExpiredRecords = getCleanArray(data.expiredRecords);
				records = cleanedRecords.items;
				expiredRecords = cleanedExpiredRecords.items;
				persistLocal();
				if (cleanedRecords.changed || cleanedExpiredRecords.changed) {
					syncCloudData();
				}
				renderRecords();
				updateStats();
			};
			cloudRef.on("value", cloudHandler, function (error) {
				console.error("Firebase 同步監聽失敗", error);
				hint.textContent = "Firebase 即時同步失敗，已切換為本機模式。";
				cloudSyncReady = false;
			});
		}

		function initCloudSync() {
			try {
				if (typeof firebase === "undefined") {
					return;
				}
				if (!firebase.apps.length) {
					firebase.initializeApp(firebaseConfig);
				}
				realtimeDb = firebase.database();
				cloudSyncReady = true;
				subscribeCloudData();
				hint.textContent = "已啟用 Firebase Realtime Database 即時同步（多人共用）。";
			} catch (error) {
				console.error("Firebase 初始化失敗", error);
				hint.textContent = "Firebase 初始化失敗，已切換為本機模式。";
				cloudSyncReady = false;

		}

		function syncCloudData() {
			if (!cloudSyncReady || !realtimeDb || !currentViewUser) {
				return;

			realtimeDb.ref(cloudRootPath + "/" + currentViewUser).set({
				records: records,
				expiredRecords: expiredRecords,
				updatedAt: Date.now()
			}).catch(function (error) {
				console.error("Firebase 寫入失敗", error);
			});
		}

		function saveExpiredRecords() {

		function parseMopAmount(text) {
			const normalized = String(text).replace(/[^\d.-]/g, "");
			const value = Number(normalized);
			return Number.isNaN(value) ? 0 : value;
		}

		function calculateSummaryFromRecords() {
			let voucherSum = 0;
			let spendingSum = 0;
			records.forEach(function (record) {
				recalculateRecordTotals(record);
				voucherSum += record.voucherTotal;
				spendingSum += getRecordSpendingTotal(record);
			});
			return { voucherSum: voucherSum, spendingSum: spendingSum };
		}

		function verifySummaryConsistency() {

			if (shownSpending !== expected.spendingSum) {

		function formatDate(date) {
			const y = date.getFullYear();
			const m = String(date.getMonth() + 1).padStart(2, "0");
			const d = String(date.getDate()).padStart(2, "0");
			return y + "-" + m + "-" + d;
		}

		function parseDateString(dateStr) {
			if (typeof dateStr !== "string") {
				return null;
			}
			const parts = dateStr.split("-");
			if (parts.length !== 3) {
				return null;
			}
			const y = Number(parts[0]);
			const m = Number(parts[1]);
			const d = Number(parts[2]);
			if (Number.isNaN(y) || Number.isNaN(m) || Number.isNaN(d)) {
				return null;
			}
			return new Date(y, m - 1, d);
		}

		function fixedDate(month, day) {
			return new Date(2000, month - 1, day);
		}

		function getPeriodInfoByDate(dateObj) {
			const target = fixedDate(dateObj.getMonth() + 1, dateObj.getDate());
			for (let i = 0; i < periodRules.length; i += 1) {
				const rule = periodRules[i];
				const start = fixedDate(rule.startMonth, rule.startDay);
				const end = fixedDate(rule.endMonth, rule.endDay);
				if (target >= start && target <= end) {
					return {
						label: rule.label,
						startMonth: rule.startMonth,
						startDay: rule.startDay,
						expiryMonth: rule.endMonth,
						expiryDay: rule.endDay
					};
				}
			}
			return null;
		}

		function addDays(date, days) {
			const copy = new Date(date);
			copy.setDate(copy.getDate() + days);
			return copy;
		}

		function getStatus(phaseStartDateStr, expiryDateStr) {
			const now = new Date();
			const today = new Date(now);
			today.setHours(0, 0, 0, 0);
			const expiry = new Date(expiryDateStr + "T23:59:59");
			if (Number.isNaN(expiry.getTime())) {
				return "-";
			}
			const msPerDay = 24 * 60 * 60 * 1000;
			const remainingMs = expiry.getTime() - now.getTime();
			if (remainingMs < 0) {
				const expiredDays = Math.ceil(Math.abs(remainingMs) / msPerDay);
				return "已過期 " + expiredDays + " 天";
			}
			const phaseStart = new Date(phaseStartDateStr + "T00:00:00");
			if (Number.isNaN(phaseStart.getTime())) {
				const diffDays = Math.floor(remainingMs / msPerDay);
				const diffHours = Math.ceil(remainingMs / (60 * 60 * 1000));
				return diffDays < 1 ? "剩餘 " + diffHours + " 小時" : "剩餘 " + diffDays + " 天";
			}
			const lotteryEndDate = new Date(phaseStart);
			lotteryEndDate.setDate(lotteryEndDate.getDate() + 2);
			lotteryEndDate.setHours(0, 0, 0, 0);
			const lotteryEndTime = new Date(lotteryEndDate);
			lotteryEndTime.setHours(23, 59, 59, 999);
			const expiryDateOnly = new Date(expiry);
			expiryDateOnly.setHours(0, 0, 0, 0);

			if (today < lotteryEndDate) {
				const lotteryRemainingDays = Math.max(1, Math.ceil((lotteryEndDate.getTime() - today.getTime()) / msPerDay));
				return "抽獎中（剩餘 " + lotteryRemainingDays + " 天）";
			}
			if (today.getTime() === lotteryEndDate.getTime()) {
				const lotteryRemainingMs = lotteryEndTime.getTime() - now.getTime();
				const lotteryRemainingHours = Math.max(1, Math.ceil(lotteryRemainingMs / (60 * 60 * 1000)));
				return "抽獎中（剩餘 " + lotteryRemainingHours + " 小時）";
			}
			if (today < expiryDateOnly) {
				const spendingRemainingDays = Math.max(1, Math.ceil((expiryDateOnly.getTime() - today.getTime()) / msPerDay));
				return "消費中（剩餘 " + spendingRemainingDays + " 天）";
			}
			const spendingRemainingHours = Math.max(1, Math.ceil(remainingMs / (60 * 60 * 1000)));
			return "消費中（剩餘 " + spendingRemainingHours + " 小時）";
		}

		function ensurePeriodData(record) {
			const created = parseDateString(record.createdDate);
			if (!created) {
				record.phaseLabel = record.phaseLabel || "-";
				record.phaseStartDate = record.phaseStartDate || "-";
				record.expiryDate = record.expiryDate || "-";
				record.status = getStatus(record.phaseStartDate, record.expiryDate);
				return;
			}
			const periodInfo = getPeriodInfoByDate(created);
			if (!periodInfo) {
				record.phaseLabel = "-";
				record.phaseStartDate = record.createdDate;
				record.expiryDate = formatDate(addDays(created, 180));
				record.status = getStatus(record.phaseStartDate, record.expiryDate);
				return;
			}
			record.phaseLabel = periodInfo.label;
			record.phaseStartDate = formatDate(new Date(created.getFullYear(), periodInfo.startMonth - 1, periodInfo.startDay));
			record.expiryDate = formatDate(new Date(created.getFullYear(), periodInfo.expiryMonth - 1, periodInfo.expiryDay));
			record.status = getStatus(record.phaseStartDate, record.expiryDate);
		}

		function formatMonthDay(dateStr) {
			if (typeof dateStr !== "string") {
				return "-";
			}
			const parts = dateStr.split("-");
			if (parts.length !== 3) {
				return dateStr;
			}
			const month = Number(parts[1]);
			const day = Number(parts[2]);
			if (Number.isNaN(month) || Number.isNaN(day)) {
				return dateStr;
			}
			return month + "/" + day;
		}

		function getPhaseDisplay(record) {
			return record.phaseLabel || "-";

		function normalizeNumber(value) {
			return typeof value === "number" && !Number.isNaN(value) ? value : 0;
		}

		function recalculateRecordTotals(record) {
			record.voucher1 = normalizeNumber(record.voucher1);
			record.voucher2 = normalizeNumber(record.voucher2);
			record.voucher3 = normalizeNumber(record.voucher3);
			record.voucherTotal = record.voucher1 + record.voucher2 + record.voucher3;
			record.spendingTotal = record.voucherTotal * 3;
		}

		function getRecordSpendingTotal(record) {
			if (typeof record.spendingTotal === "number" && !Number.isNaN(record.spendingTotal)) {
				return record.spendingTotal;
			}
			return normalizeNumber(record.voucherTotal) * 3;
		}

		function getVoucherLabel(field) {
			if (field === "voucher1") {
				return "券一";
			}
			if (field === "voucher2") {
				return "券二";
			}
			if (field === "voucher3") {
				return "券三";
			}
			return "券";
		}

		function isExpiredStatus(statusText) {
			return typeof statusText === "string" && statusText.indexOf("已過期") === 0;
		}

		function archiveRecord(record, statusText) {
			const archivedRecord = Object.assign({}, record, { status: statusText });
			expiredRecords = [archivedRecord].concat(expiredRecords).filter(function (item, index, array) {
				return array.findIndex(function (candidate) {
					return candidate.id === item.id;
				}) === index;
			});
		}

		function moveExpiredRecordsToArchive() {
			if (records.length === 0) {
				return;
			}
			const active = [];
			const moved = [];
			records.forEach(function (record) {
				ensurePeriodData(record);
				if (isExpiredStatus(record.status)) {
					moved.push(record);
				} else {
					active.push(record);
				}
			});
			if (moved.length === 0) {
				return;
			}
			records = active;
			moved.forEach(function (record) {
				archiveRecord(record, record.status);
			});
			saveRecords();
			saveExpiredRecords();
		}

		function renderExpiredRecords() {
			expiredRecords.forEach(function (record) {
				recalculateRecordTotals(record);
				if (record.status !== "已消費") {
					ensurePeriodData(record);
				}
			});
			if (expiredRecords.length === 0) {
				expiredRecordBody.innerHTML = "<tr><td colspan=\"9\">目前沒有已使用或已過期的消費券。</td></tr>";
				return;
			}
			expiredRecordBody.innerHTML = expiredRecords.map(function (record) {
				return "<tr>"
					+ "<td>" + (record.createdBy || currentViewUser) + "</td>"
					+ "<td>" + getPhaseDisplay(record) + "</td>"
					+ "<td>" + record.channel + "</td>"
					+ "<td>" + record.voucher1 + "</td>"
					+ "<td>" + record.voucher2 + "</td>"
					+ "<td>" + record.voucher3 + "</td>"
					+ "<td>" + record.voucherTotal + "</td>"
					+ "<td>" + record.spendingTotal + "</td>"
					+ "<td>" + (record.status || "-") + "</td>"
					+ "</tr>";
			}).join("");
		}

		function renderRecords() {
			moveExpiredRecordsToArchive();
			listOwner.textContent = currentViewUser;
			currentViewTag.textContent = "目前檢視：" + currentViewUser;
			accountButtons.forEach(function (btn) {
				btn.classList.toggle("active", btn.getAttribute("data-user") === currentViewUser);
			});
			if (records.length === 0) {
				recordBody.innerHTML = "<tr><td colspan=\"8\">尚未有記錄，請先選擇支付渠道與券金額後按完成。</td></tr>";
				listExpiryDate.textContent = "-";
				listStatus.textContent = "-";
				renderExpiredRecords();
				closeEditChooser();
				verifySummaryConsistency();
				updateStats();
				return;
			}
			recordBody.innerHTML = records.map(function (record) {
				recalculateRecordTotals(record);
				ensurePeriodData(record);
				const disabledAttr = canEditCurrentView() ? "" : " disabled";
				return "<tr>"
					+ "<td>" + getPhaseDisplay(record) + "</td>"
					+ "<td>" + record.channel + "</td>"
					+ "<td><div class=\"amount-cell\"><span>" + record.voucher1 + "</span><button type=\"button\" class=\"edit-inline-btn edit-voucher-btn\" data-id=\"" + record.id + "\" data-field=\"voucher1\"" + disabledAttr + ">✎</button></div></td>"
					+ "<td><div class=\"amount-cell\"><span>" + record.voucher2 + "</span><button type=\"button\" class=\"edit-inline-btn edit-voucher-btn\" data-id=\"" + record.id + "\" data-field=\"voucher2\"" + disabledAttr + ">✎</button></div></td>"
					+ "<td><div class=\"amount-cell\"><span>" + record.voucher3 + "</span><button type=\"button\" class=\"edit-inline-btn edit-voucher-btn\" data-id=\"" + record.id + "\" data-field=\"voucher3\"" + disabledAttr + ">✎</button></div></td>"
					+ "<td>" + record.voucherTotal + "</td>"
					+ "<td>" + record.spendingTotal + "</td>"
					+ "<td><div class=\"action-cell\"><button type=\"button\" class=\"consume-btn\" data-id=\"" + record.id + "\"" + disabledAttr + ">已用</button><button type=\"button\" class=\"delete-btn\" data-id=\"" + record.id + "\"" + disabledAttr + ">刪除</button></div></td>"
					+ "</tr>";
			}).join("");
			const latestRecord = records[0];
			listExpiryDate.textContent = latestRecord.expiryDate || "-";
			listStatus.textContent = latestRecord.status || "-";
			renderExpiredRecords();
			verifySummaryConsistency();
			updateStats();
		}

		function clearSelections() {
			voucherCards.forEach(function (card) {
				card.querySelectorAll(".value-btn").forEach(function (btn) {
					btn.classList.remove("selected");
				});
			});
			finishWrap.classList.remove("show");
		}

		function getSelectedValue(card) {
			const selectedBtn = card.querySelector(".value-btn.selected");
			if (!selectedBtn) {
				return 0;
			}
			return Number(selectedBtn.getAttribute("data-value")) || 0;
		}

		function switchViewUser(user) {
			currentViewUser = user;
			records = loadRecords(user);
			expiredRecords = loadExpiredRecords(user);
			subscribeCloudData();
			renderRecords();
			updateStats();
		}

		function closeMenu() {
			menuPanel.classList.remove("show");
			addBtn.setAttribute("aria-expanded", "false");
		}

		function setLoginState(user) {
			currentUser = user;
			const isLoggedIn = Boolean(currentUser);
			addBtn.disabled = !isLoggedIn || !canEditCurrentView();
			if (isLoggedIn) {
				currentUserTag.textContent = "目前登入：" + currentUser.name;
				logoutBtn.classList.add("show");
				loginOverlay.style.display = "none";
				if (accountButtons.some(function (btn) { return btn.getAttribute("data-user") === currentUser.name; })) {
					switchViewUser(currentUser.name);
				}
				hint.textContent = canEditCurrentView() ? "已登入：" + currentUser.name + "，可開始新增或修改資料。" : "已登入：" + currentUser.name + "，目前正查看其他帳號記錄。";
				updateStats();
				return;
			}
			currentUserTag.textContent = "未登入";
			logoutBtn.classList.remove("show");
			loginOverlay.style.display = "flex";
			closeMenu();
			voucherPanel.classList.remove("show");
			finishWrap.classList.remove("show");
			selectedChannel = "";
			hint.textContent = "請先登入後再操作。";
			updateStats();
		}

		topBanner.addEventListener("error", function () {
			topBanner.style.display = "none";
			bannerFallback.style.display = "block";
		});

		loginForm.addEventListener("submit", function (event) {
			event.preventDefault();
			const username = loginUser.value.trim();
			const password = autoLoginPassword;
			const matched = loginUsers.find(function (item) {
				return item.username === username && item.password === password;
			});
			if (!matched) {
				loginError.textContent = "帳號或密碼錯誤，請再試一次。";
				return;
			}
			loginError.textContent = "";
			setLoginState({ username: matched.username, name: matched.name });
		});

		logoutBtn.addEventListener("click", function () {
			setLoginState(null);
		});

		addBtn.addEventListener("click", function () {
			if (!currentUser) {
				hint.textContent = "請先登入後再新增記錄。";
				return;
			}
			if (!canEditCurrentView()) {
				hint.textContent = "你只能修改自己帳號的記錄列表。";
				return;
			}
			const isOpen = menuPanel.classList.toggle("show");
			addBtn.setAttribute("aria-expanded", String(isOpen));
		});

		document.addEventListener("click", function (event) {
			if (!menuPanel.contains(event.target) && !addBtn.contains(event.target)) {
				closeMenu();
			}
		});

		document.addEventListener("keydown", function (event) {
			if (event.key === "Escape") {
				closeMenu();
				closeEditChooser();
			}
		});

		accountButtons.forEach(function (btn) {
			btn.addEventListener("click", function () {
				switchViewUser(btn.getAttribute("data-user"));
				if (currentUser) {
					hint.textContent = canEditCurrentView() ? "目前正在管理「" + currentViewUser + "」的記錄。" : "目前正在查看「" + currentViewUser + "」的記錄。";
				}
			});
		});

		optionButtons.forEach(function (btn) {
			btn.addEventListener("click", function () {
				if (!currentUser) {
					hint.textContent = "請先登入後再選擇支付渠道。";
					return;
				}
				if (!canEditCurrentView()) {
					hint.textContent = "你只能修改自己帳號的記錄列表。";
					return;
				}
				selectedChannel = btn.textContent;
				clearSelections();
				hint.textContent = "你選擇的支付渠道：" + selectedChannel;
				voucherPanel.classList.add("show");
				finishWrap.classList.add("show");
				closeMenu();
				updateStats();
			});
		});

		voucherCards.forEach(function (card) {
			const valueButtons = Array.from(card.querySelectorAll(".value-btn"));
			valueButtons.forEach(function (valueBtn) {
				valueBtn.addEventListener("click", function () {
					valueButtons.forEach(function (btn) {
						btn.classList.remove("selected");
					});
					valueBtn.classList.add("selected");
					finishWrap.classList.add("show");
					updateStats();
				});
			});
		});

		finishBtn.addEventListener("click", function () {
			if (!currentUser) {
				hint.textContent = "請先登入後再新增記錄。";
				return;
			}
			if (!canEditCurrentView()) {
				hint.textContent = "你只能修改自己帳號的記錄列表。";
				return;
			}
			if (!selectedChannel) {
				hint.textContent = "請先選擇支付渠道。";
				return;
			}
			if (records.some(function (record) { return record.channel === selectedChannel; })) {
				hint.textContent = "此支付渠道已存在，不能重覆新增。";
				return;
			}
			if (records.length >= maxRecords) {
				hint.textContent = "記錄列表最多只能有 8 筆數據。";
				return;
			}
			const now = new Date();
			const createdDate = formatDate(now);
			const periodInfo = getPeriodInfoByDate(now);
			const phaseLabel = periodInfo ? periodInfo.label : "-";
			const phaseStartDate = periodInfo ? formatDate(new Date(now.getFullYear(), periodInfo.startMonth - 1, periodInfo.startDay)) : createdDate;
			const expiryDate = periodInfo ? formatDate(new Date(now.getFullYear(), periodInfo.expiryMonth - 1, periodInfo.expiryDay)) : formatDate(addDays(now, 180));
			const voucher1 = getSelectedValue(voucherCards[0]);
			const voucher2 = getSelectedValue(voucherCards[1]);
			const voucher3 = getSelectedValue(voucherCards[2]);
			const voucherTotal = voucher1 + voucher2 + voucher3;
			const spendingTotal = voucherTotal * 3;
			records.unshift({
				id: Date.now(),
				createdBy: currentUser.name,
				phaseLabel: phaseLabel,
				phaseStartDate: phaseStartDate,
				channel: selectedChannel,
				createdDate: createdDate,
				voucher1: voucher1,
				voucher2: voucher2,
				voucher3: voucher3,
				voucherTotal: voucherTotal,
				spendingTotal: spendingTotal,
				expiryDate: expiryDate,
				status: getStatus(phaseStartDate, expiryDate)
			});
			saveRecords();
			renderRecords();
			hint.textContent = "已記錄完成：" + selectedChannel + "，消費券總額 " + voucherTotal;
			voucherPanel.classList.remove("show");
			selectedChannel = "";
			clearSelections();
			updateStats();
		});

		cancelBtn.addEventListener("click", function () {
			clearSelections();
			voucherPanel.classList.remove("show");
			selectedChannel = "";
			hint.textContent = "已取消本次選擇。";
			updateStats();
		});

		recordBody.addEventListener("click", function (event) {
			const target = event.target;
			if (!(target instanceof HTMLElement)) {
				return;
			}
			if (target.classList.contains("edit-voucher-btn")) {
				const id = Number(target.getAttribute("data-id"));
				const field = target.getAttribute("data-field") || "";
				const record = records.find(function (item) { return item.id === id; });
				if (!record || !field) {
					return;
				}
				openEditChooser(id, field, normalizeNumber(record[field]));
				return;
			}
			if (!canEditCurrentView()) {
				return;
			}
			if (target.classList.contains("consume-btn")) {
				const consumeId = Number(target.getAttribute("data-id"));
				const consumeRecord = records.find(function (record) { return record.id === consumeId; });
				if (!consumeRecord) {
					return;
				}
				records = records.filter(function (record) { return record.id !== consumeId; });
				archiveRecord(consumeRecord, "已消費");
				saveRecords();
				saveExpiredRecords();
				renderRecords();
				updateStats();
				hint.textContent = consumeRecord.channel + " 已標記為已消費。";
				if (editingRecordId === consumeId) {
					closeEditChooser();
				}
				return;
			}
			if (!target.classList.contains("delete-btn")) {
				return;
			}
			const id = Number(target.getAttribute("data-id"));
			records = records.filter(function (record) { return record.id !== id; });
			saveRecords();
			renderRecords();
			updateStats();
			if (editingRecordId === id) {
				closeEditChooser();
			}
		});

		chooserButtons.forEach(function (btn) {
			btn.addEventListener("click", function () {
				editingValue = Number(btn.getAttribute("data-value")) || 0;
				chooserButtons.forEach(function (item) {
					item.classList.remove("selected");
				});
				btn.classList.add("selected");
			});
		});

		chooserFinish.addEventListener("click", function () {
			if (!editingRecordId || !editingField || !canEditCurrentView()) {
				return;
			}
			const record = records.find(function (item) { return item.id === editingRecordId; });
			if (!record) {
				closeEditChooser();
				return;
			}
			record[editingField] = editingValue;
			recalculateRecordTotals(record);
			saveRecords();
			renderRecords();
			updateStats();
			hint.textContent = record.channel + " 的 " + getVoucherLabel(editingField) + " 已修改為 " + editingValue;
			closeEditChooser();
		});

		expiredToggleBtn.addEventListener("click", function () {
			const isOpen = expiredSection.classList.toggle("show");
			expiredToggleBtn.setAttribute("aria-expanded", String(isOpen));
			expiredToggleBtn.textContent = isOpen ? "收起已使用/已過期的消費券" : "查看已使用/已過期的消費券";
			if (isOpen) {
				renderExpiredRecords();
			}
		});

		switchViewUser("樂");
		setLoginState(null);
		initCloudSync();
	</script>
</body>
</html>
